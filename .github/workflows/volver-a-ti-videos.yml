# Actualiza la web de Volver a Ti con los vídeos nuevos del canal cada hora.
name: Volver a Ti · actualizar vídeos
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node volver-a-ti/tools/update-videos.mjs
      - name: Publicar cambios
        run: |
          if [ -n "$(git status --porcelain volver-a-ti/assets/data)" ]; then
            git config user.name "volver-a-ti-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add volver-a-ti/assets/data
            git commit -m "Volver a Ti: nuevos vídeos del canal"
            git push
          fi
