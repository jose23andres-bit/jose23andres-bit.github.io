# Volver a Ti · Shorts verticales automáticos, 4 al día (2 de consejos kawaii con voz + 2 de paisajes) (08:00, 13:00, 18:00 y 21:00 hora de España).
# Límite: la cuota gratuita de la API de YouTube (10.000 unidades/día) permite unas 6 subidas diarias en total.
name: Volver a Ti · Shorts
on:
  schedule:
    - cron: "0 7,12,17,20 * * *"
  workflow_dispatch:
    inputs:
      program: { description: "ID del programa (vacío = rotación)", required: false }
jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    defaults: { run: { working-directory: volver-a-ti/broadcast } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Instalar herramientas
        run: |
          npm ci && npx playwright install --with-deps chromium
          pip install numpy scipy imageio-ffmpeg
      - name: Comprobar claves con YouTube
        run: node upload.mjs x x x --check
      - uses: actions/cache@v4
        with: { path: volver-a-ti/broadcast/voices, key: piper-daniela-high-v1 }
      - name: Voz en español (Piper)
        run: |
          pip install piper-tts
          mkdir -p voices && cd voices
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_AR/daniela/high/es_AR-daniela-high
          [ -f es_AR-daniela-high.onnx ] || { curl -sL -o es_AR-daniela-high.onnx $B.onnx; curl -sL -o es_AR-daniela-high.onnx.json $B.onnx.json; }
      - name: Elegir programa y frase
        id: pick
        run: |
          node -e '
            const c=require("./programs.json"), n=Math.floor(Date.now()/36e5);
            const want="${{ github.event.inputs.program }}";
            const land=c.programs.filter(x=>x.id!=="consejos"), tips=c.programs.find(x=>x.id==="consejos"); const p=want?c.programs.find(x=>x.id===want):(n%2===0?tips:land[(n*5)%land.length]);
            const i=Math.floor(n/c.programs.length)%p.shorts.length;
            const fs=require("fs"); const tip=p.id==="consejos", day=Math.floor(n/24), ii=tip?(day*2+1+(n%24>=19?1:0))%p.shorts.length:i; fs.appendFileSync(process.env.GITHUB_OUTPUT,`id=${p.id}\nidx=${ii}\nphrase=${p.shorts[ii].phrase}\nvoice=${tip?"tips":(day%2===0?"short":"")}\n`);
            console.log(p.id, i, p.shorts[i].phrase);'
      - name: Renderizar Short (30 s, 1080x1920)
        run: VAT_SEED=${{ github.run_id }} VAT_PYTHON=python VAT_OUT=out VAT_PRESET=veryfast node render.mjs --only ${{ steps.pick.outputs.id }} --seconds 30 --w 1080 --h 1920 --phrase "${{ steps.pick.outputs.phrase }}" --cta "Vídeo completo en el canal" --name short ${{ steps.pick.outputs.voice && '--voice ' || '' }}${{ steps.pick.outputs.voice }}
      - name: Subir Short
        run: VAT_HAS_VOICE=${{ steps.pick.outputs.voice && '1' || '' }} node upload.mjs out/short.mp4 - ${{ steps.pick.outputs.id }} --short ${{ steps.pick.outputs.idx }}
