# Volver a Ti · 10:00 meditación guiada con voz (10 min) · 22:00 vídeo de 1 HORA para dormir con introducción hablada (hora de España).
# Cada vídeo varía la música (ánimo, acordes, instrumentos) con VAT_SEED.
# Se activa en cuanto existan los secretos YT_CLIENT_ID, YT_CLIENT_SECRET y YT_REFRESH_TOKEN.
name: Volver a Ti · vídeo diario
on:
  schedule:
    - cron: "0 9,21 * * *"
  workflow_dispatch:
    inputs:
      program: { description: "ID del programa (vacío = rotación diaria)", required: false }
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    defaults: { run: { working-directory: volver-a-ti/broadcast } }
    steps:
      - name: Comprobar autorización del canal
        id: auth
        working-directory: .
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then echo "Sin autorización de YouTube todavía: no se sube nada."; echo "ok=0" >> $GITHUB_OUTPUT; else echo "ok=1" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.auth.outputs.ok == '1'
      - uses: actions/setup-node@v4
        if: steps.auth.outputs.ok == '1'
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        if: steps.auth.outputs.ok == '1'
        with: { python-version: "3.12" }
      - name: Instalar herramientas
        if: steps.auth.outputs.ok == '1'
        run: |
          npm ci && npx playwright install --with-deps chromium
          pip install numpy scipy imageio-ffmpeg pillow
      - name: Comprobar claves con YouTube
        if: steps.auth.outputs.ok == '1'
        run: node upload.mjs x x x --check
      - uses: actions/cache@v4
        if: steps.auth.outputs.ok == '1'
        with: { path: volver-a-ti/broadcast/voices, key: piper-daniela-high-v1 }
      - name: Voz en español (Piper)
        if: steps.auth.outputs.ok == '1'
        run: |
          pip install piper-tts
          mkdir -p voices && cd voices
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_AR/daniela/high/es_AR-daniela-high
          [ -f es_AR-daniela-high.onnx ] || { curl -sL -o es_AR-daniela-high.onnx $B.onnx; curl -sL -o es_AR-daniela-high.onnx.json $B.onnx.json; }
      - name: Elegir programa del día
        if: steps.auth.outputs.ok == '1'
        id: pick
        run: |
          P="${{ github.event.inputs.program }}"
          if [ -z "$P" ]; then P=$(node -e 'const c=require("./programs.json");const n=Math.floor(Date.now()/432e5),night=new Date().getUTCHours()>=18,sleep=["lluvia-sueno","luna-dormir","oceano-528","bosque-432"];console.log(night?sleep[Math.floor(n/2)%sleep.length]:c.programs[(n*4)%c.programs.length].id)'); fi
          echo "id=$P" >> $GITHUB_OUTPUT; echo "Programa: $P"
      - name: Duración (de noche, 1 hora)
        if: steps.auth.outputs.ok == '1'
        id: dur
        run: |
          H=$(date -u +%H); if [ "$H" -ge 18 ]; then echo "min=60" >> $GITHUB_OUTPUT; echo "voice=sleep" >> $GITHUB_OUTPUT; else echo "min=10" >> $GITHUB_OUTPUT; echo "voice=guided" >> $GITHUB_OUTPUT; fi
      - name: Renderizar vídeo (1080p)
        if: steps.auth.outputs.ok == '1'
        run: VAT_SEED=${{ github.run_id }} VAT_PYTHON=python VAT_OUT=out VAT_PRESET=veryfast VAT_WORKERS=1 node render.mjs --only ${{ steps.pick.outputs.id }} --seconds $(( ${{ steps.dur.outputs.min }} * 60 )) --voice ${{ steps.dur.outputs.voice }}
      - name: Miniatura
        if: steps.auth.outputs.ok == '1'
        run: |
          FF=$(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
          $FF -loglevel error -y -ss 120 -i out/${{ steps.pick.outputs.id }}.mp4 -frames:v 1 out/frame.png
          node -e 'const p=require("./programs.json").programs.find(x=>x.id==="${{ steps.pick.outputs.id }}");const t=p.thumb||{};require("fs").writeFileSync("out/thumb.json",JSON.stringify([t.big||p.title,t.script||p.title,t.tag||"VOLVER A TI"]))'
          python -c "import json,subprocess;a=json.load(open('out/thumb.json'));subprocess.run(['python','thumbnail.py','out/frame.png','out/thumb.jpg',*a],check=True)"
      - name: Subir a YouTube
        if: steps.auth.outputs.ok == '1'
        run: VAT_HAS_VOICE=1 VAT_MINUTES=${{ steps.dur.outputs.min }} node upload.mjs out/${{ steps.pick.outputs.id }}.mp4 out/thumb.jpg ${{ steps.pick.outputs.id }}
