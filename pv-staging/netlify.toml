# PowerVane & Wellness · Vanessa PowerVane
# Web estática: se publica tal cual, sin compilación.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Siempre la última versión de la página, el service worker y el manifiesto
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS y JS llevan ?v=..., las imágenes y vídeos cambian poco
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/admin-live.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# La antigua ruta /powervane/ lleva a la raíz
[[redirects]]
  from = "/powervane/*"
  to = "/:splat"
  status = 301
