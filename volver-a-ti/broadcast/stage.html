<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Volver a Ti · Escenario de emisión</title>
<!-- Escenario 1920x1080 del directo. El renderizador llama a window.renderFrame(t) fotograma a fotograma. -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Great+Vibes&family=Baloo+2:wght@800&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="stage"></canvas>
<script src="../assets/js/scenes.js"></script>
<script>
(function () {
  "use strict";
  const q = new URLSearchParams(location.search);
  const W = +(q.get("w") || 1920), H = +(q.get("h") || 1080), TAU = Math.PI * 2, VERT = H > W;
  document.getElementById("stage").width = W; document.getElementById("stage").height = H;
  const P = {
    scene: q.get("scene") || "bosque",
    title: q.get("title") || "Volver a Ti",
    subtitle: q.get("subtitle") || "",
    breath: q.get("breath") === "1",
    duration: +(q.get("duration") || 600),
    phrase: q.get("phrase") || "",
    cta: q.get("cta") || "",
  };
  const cv = document.getElementById("stage"), ctx = cv.getContext("2d");
  const scene = window.VAT_SCENES[P.scene](W, H, { preview: false });

  const load = (src) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });
  let mark = null, markIsOriginal = false;

  // Marca de agua: logotipo original (si existe) recortado en círculo, o el emblema vectorial
  async function prepare() {
    const orig = await load("../assets/img/logo-original.png");
    if (orig) { mark = orig; markIsOriginal = true; }
    else mark = await load("../assets/img/logo-transparent.svg");
    if (document.fonts) { await document.fonts.load('48px "Great Vibes"'); await document.fonts.load('800 60px "Baloo 2"'); await document.fonts.load('300 24px "Jost"'); await document.fonts.load('500 40px "Cormorant Garamond"'); await document.fonts.load('italic 500 50px "Cormorant Garamond"'); await document.fonts.ready; }
  }

  const ease = (x) => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, x)));
  const env = (t, a, b, fade) => Math.min(ease((t - a) / fade), ease((b - t) / fade));

  function watermark(t) {
    if (!mark) return;
    const size = VERT ? 120 : 132, x = VERT ? (W - 120) / 2 : 64, y = VERT ? 210 : 56;
    ctx.save(); ctx.globalAlpha = 0.82;
    ctx.shadowColor = "rgba(245,198,106,.45)"; ctx.shadowBlur = 24;
    if (markIsOriginal) { ctx.beginPath(); ctx.arc(x + size / 2, y + size / 2, size / 2, 0, TAU); ctx.clip(); }
    ctx.drawImage(mark, x, y, size, size);
    ctx.restore();
  }

  // Rótulo inferior: aparece 14 s cada 4 minutos (y al inicio)
  function lowerThird(t) {
    const period = 240, ph = t % period;
    const a = env(ph, 6, 20, 2.2);
    if (a <= 0) return;
    ctx.save(); ctx.globalAlpha = a;
    const x = 72, y = H - 150, slide = (1 - a) * 18;
    const g = ctx.createLinearGradient(x, 0, x + 760, 0);
    g.addColorStop(0, "rgba(11,2,32,.62)"); g.addColorStop(1, "rgba(11,2,32,0)");
    ctx.fillStyle = g; ctx.fillRect(x - 24, y - 64, 820, 132);
    ctx.fillStyle = "#f5c66a"; ctx.fillRect(x - 24, y - 64, 2, 132);
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#f5c66a"; ctx.font = '300 20px "Jost"';
    ctx.fillText("V O L V E R   A   T I   ·   E N   D I R E C T O", x + slide, y - 26);
    ctx.fillStyle = "#fbf3e4"; ctx.font = '500 44px "Cormorant Garamond"';
    ctx.fillText(P.title, x + slide, y + 22);
    if (P.subtitle) { ctx.fillStyle = "rgba(239,230,247,.75)"; ctx.font = '300 22px "Jost"'; ctx.fillText(P.subtitle, x + slide, y + 56); }
    ctx.restore();
  }

  // Guía de respiración 4 · 2 · 6 (esquina inferior derecha)
  function breathGuide(t) {
    if (!P.breath) return;
    const cyc = 12, ph = t % cyc;
    let k, txt;
    if (ph < 4) { k = ease(ph / 4); txt = "Inhala"; } else if (ph < 6) { k = 1; txt = "Sostén"; } else { k = 1 - ease((ph - 6) / 6); txt = "Exhala"; }
    const show = Math.min(1, t / 4);
    const cx = VERT ? W / 2 : W - 190, cy = VERT ? H * 0.56 : H - 190, r = 46 + 48 * k;
    ctx.save(); ctx.globalAlpha = 0.9 * show;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 1.6);
    g.addColorStop(0, "rgba(245,198,106,.32)"); g.addColorStop(1, "rgba(245,198,106,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r * 1.6, 0, TAU); ctx.fill();
    ctx.strokeStyle = "rgba(255,241,199,.85)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = "rgba(245,198,106,.35)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, 96, 0, TAU); ctx.stroke();
    ctx.fillStyle = "#fbe9c2"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = '400 40px "Great Vibes"'; ctx.fillText(txt, cx, cy);
    ctx.restore();
  }

  // Shorts: frase grande que aparece poco a poco + llamada a la acción
  function shortText(t) {
    if (!VERT || !P.phrase) return;
    const a = Math.min(1, Math.max(0, (t - 0.8) / 1.6));
    ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const strip = (x) => x.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\uFE0F]/gu, "").trim();
    const lines = strip(P.phrase).split("|"), size = 124, y0 = H * 0.47 - (lines.length - 1) * size * 0.52;
    ctx.save(); ctx.translate(W / 2, H * 0.5); ctx.scale(1, 0.62);
    const veil = ctx.createRadialGradient(0, 0, 0, 0, 0, W * 0.8);
    veil.addColorStop(0, `rgba(8,2,24,${0.5 * a})`); veil.addColorStop(0.6, `rgba(8,2,24,${0.22 * a})`); veil.addColorStop(1, "rgba(8,2,24,0)");
    ctx.fillStyle = veil; ctx.beginPath(); ctx.arc(0, 0, W * 0.8, 0, TAU); ctx.fill(); ctx.restore();
    ctx.globalAlpha = a; ctx.shadowColor = "rgba(0,0,0,.65)"; ctx.shadowBlur = 30;
    const g = ctx.createLinearGradient(0, y0 - 80, 0, y0 + lines.length * size);
    g.addColorStop(0, "#fff4cc"); g.addColorStop(0.6, "#f6c45c"); g.addColorStop(1, "#ffe1a0");
    ctx.fillStyle = g; ctx.font = `400 ${size}px "Great Vibes"`;
    lines.forEach((l, i) => ctx.fillText(l.trim(), W / 2, y0 + i * size * 1.05 + (1 - a) * 20));
    if (P.cta) {
      const b = Math.min(1, Math.max(0, (t - 4) / 1.5)) * (0.75 + 0.25 * Math.sin(t * 2));
      ctx.globalAlpha = b; ctx.shadowBlur = 16; ctx.fillStyle = "#fbf3e4"; ctx.font = '300 40px "Jost"';
      ctx.fillText(strip(P.cta), W / 2, H * 0.47 + lines.length * size * 0.62 + 40);
    }
    ctx.restore();
  }

  // Subtítulos de la voz guiada
  let speaking = false;
  const KAWAII = P.scene === "kawaii";
  function wrap(text, maxW) { const words = text.split(" "), lines = []; let cur = ""; for (const w of words) { const tst = cur ? cur + " " + w : w; if (ctx.measureText(tst).width > maxW && cur) { lines.push(cur); cur = w; } else cur = tst; } lines.push(cur); return lines; }
  function outlined(text, x, y, fill, stroke) { ctx.lineJoin = "round"; ctx.lineWidth = stroke; ctx.strokeStyle = "#1b0b2e"; ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y); }
  function kawaiiText(t) {
    const caps = window.CAPTIONS || [];
    let c = null; for (const x of caps) if (t >= x.t0 - 0.2) c = x;
    ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (c) {
      const a = Math.min(1, (t - c.t0 + 0.2) / 0.25), pop = 0.9 + 0.1 * Math.min(1, a);
      ctx.globalAlpha = a; ctx.font = '800 86px "Baloo 2"';
      const lines = wrap(c.text, W * 0.84), lh = 92, y0 = H * 0.2 - (lines.length - 1) * lh / 2;
      ctx.save(); ctx.translate(W / 2, H * 0.2); ctx.scale(pop, pop); ctx.translate(-W / 2, -H * 0.2);
      lines.forEach((l, i) => outlined(l, W / 2, y0 + i * lh, "#ffffff", 16));
      ctx.restore();
      ctx.font = '800 40px "Baloo 2"'; outlined(P.title.toUpperCase(), W / 2, y0 + lines.length * lh + 6, "#ffd23a", 10);
    }
    ctx.globalAlpha = 1; ctx.font = '800 64px "Baloo 2"'; outlined("Volver a Ti", W / 2, H * 0.87, "#ffffff", 14);
    ctx.font = '800 32px "Baloo 2"'; outlined("@volveratibydayanaquintero", W / 2, H * 0.915, "#ff9bd2", 9);
    ctx.restore();
  }
  function captions(t) {
    if (KAWAII) return kawaiiText(t);
    const caps = window.CAPTIONS || [];
    const c = caps.find((x) => t >= x.t0 - 0.4 && t <= x.t1 + 0.9);
    speaking = !!c;
    if (!c) return;
    const a = Math.min(1, (t - c.t0 + 0.4) / 0.5, (c.t1 + 0.9 - t) / 0.6);
    const size = VERT ? 54 : 50, maxW = VERT ? W * 0.82 : W * 0.62, y = VERT ? H * 0.7 : H * 0.83;
    ctx.save(); ctx.globalAlpha = Math.max(0, a); ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `italic 500 ${size}px "Cormorant Garamond"`;
    const words = c.text.split(" "), lines = []; let cur = "";
    for (const w of words) { const tst = cur ? cur + " " + w : w; if (ctx.measureText(tst).width > maxW && cur) { lines.push(cur); cur = w; } else cur = tst; }
    lines.push(cur);
    const lh = size * 1.25, y0 = y - (lines.length - 1) * lh / 2;
    ctx.save(); ctx.translate(W / 2, y); ctx.scale(1, 0.35 + 0.1 * lines.length);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, maxW * 0.7); g.addColorStop(0, "rgba(8,2,24,.55)"); g.addColorStop(1, "rgba(8,2,24,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, maxW * 0.7, 0, TAU); ctx.fill(); ctx.restore();
    ctx.shadowColor = "rgba(0,0,0,.8)"; ctx.shadowBlur = 14; ctx.fillStyle = "#fbf3e4";
    lines.forEach((l, i) => ctx.fillText(l, W / 2, y0 + i * lh));
    ctx.restore();
  }

  function vignette() {
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(5,0,15,.55)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  // Fundido desde y hacia negro en los extremos del segmento (encadenado suave entre programas)
  function fades(t) {
    const fd = VERT ? 0.6 : 2.5; const a = 1 - Math.min(ease(t / fd), ease((P.duration - t) / fd));
    if (a <= 0) return;
    ctx.fillStyle = `rgba(5,1,15,${a})`; ctx.fillRect(0, 0, W, H);
  }

  window.renderFrame = function (t) {
    const capsNow = (window.CAPTIONS || []).some((x) => t >= x.t0 - 1.2 && t <= x.t1 + 1.5);
    window.VAT_NO_LABEL = capsNow || (VERT && !!P.phrase);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
    scene.draw(ctx, t);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
    if (!KAWAII) { vignette(); watermark(t); } breathGuide(t); shortText(t); captions(t); if (!VERT && !speaking) lowerThird(t); fades(t);
  };
  window.stageReady = prepare().then(() => true);

  // Vista previa en vivo si se abre en un navegador normal
  if (q.get("preview") === "1") window.stageReady.then(() => { const t0 = performance.now(); const loop = () => { window.renderFrame((performance.now() - t0) / 1000); requestAnimationFrame(loop); }; loop(); });
})();
</script>
</body>
</html>
